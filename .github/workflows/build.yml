name: Build Wear OS APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.6

    - name: Build Debug APK
      run: ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: namaz-vakit-wear-debug
        path: app/build/outputs/apk/debug/app-debug.apk
